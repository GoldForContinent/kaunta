name = "kaunta-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "kaunta"
database_id = "d56e6a40-24db-4b60-9009-1aace5ff9a1d"
