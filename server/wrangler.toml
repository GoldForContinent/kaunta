# MPESA_CONSUMER_SECRET = "xxx"
# MPESA_PASSPHRASE = "xxx"
# MPESA_TILL = "123456"
# DARAJA_CALLBACK_URL = "https://kaunta-api.kaunta-api.workers.dev/api/pay/callback"
DARAJA_CALLBACK_URL = "https://kaunta-api.kaunta-api.workers.dev/api/pay/callback"